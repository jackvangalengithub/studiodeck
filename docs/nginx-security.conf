# Include in your HTTPS server block. Adapt the root and PHP-FPM socket.
# Do not add a static /assets location, try_files $uri, or public CDN caching.
root /srv/studiodeck/public;
location / {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/router.php;
    fastcgi_param SCRIPT_NAME /router.php;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
}
