<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-login-copy="login_title">{{login_title}}</title><link rel="stylesheet" href="/auth/login.css"></head>
<body><main><a class="brand" href="/login">studio<strong>deck</strong></a><h1 data-login-copy="login_welcome">{{login_welcome}}</h1><p id="intro" data-login-copy="login_intro">{{login_intro}}</p><form id="login"><label id="email-label"><span data-login-copy="login_email">{{login_email}}</span><input id="email" type="email" autocomplete="email" required></label><button id="submit" type="submit">{{login_submit}}</button></form><p id="status" role="status" aria-live="polite"></p><p class="note" data-login-copy="login_note">{{login_note}}</p><a id="request" href="/login" hidden><span data-login-copy="login_request">{{login_request}}</span></a></main><script type="application/json" id="login-translations">{{login_translations}}</script><script src="/auth/login.js" defer></script></body></html>
