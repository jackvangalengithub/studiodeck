# Static HTML/CSS/JS frontend with same-origin proxying to the platform backend.
services:
  web:
    build: .
    image: studiodeck-frontend
    environment:
      PLATFORM_UPSTREAM: ${PLATFORM_UPSTREAM:-http://host.docker.internal:8101}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HOST_PORT:-8080}:8080"
    restart: unless-stopped
