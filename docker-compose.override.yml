# Local development: use the current workspace even when an older image is rebuilt.
services:
  marketing:
    image: studiodeck
    command: python3 -m http.server 8080 --directory /app/www
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./www:/app/www:ro
    ports:
      - "127.0.0.1:${MARKETING_PORT:-4180}:8080"
    restart: unless-stopped
  web:
    environment:
      # All local emails go to this project's MailCatcher, regardless of .env.
      MAIL_TRANSPORT: mail
      # Publish local website drafts without a paid subscription. Production ignores this flag.
      WEBSITE_LOCAL_FREE: ${WEBSITE_LOCAL_FREE:-true}
    volumes:
      - ./app:/app/app:ro
      - ./public:/app/public:ro
      - ./scripts:/app/scripts:ro
      - ./docker/local-mail.ini:/usr/local/etc/php/conf.d/zz-local-mail.ini:ro
    depends_on:
      mailcatcher:
        condition: service_healthy
  worker:
    environment:
      MAIL_TRANSPORT: mail
      WEBSITE_LOCAL_FREE: ${WEBSITE_LOCAL_FREE:-true}
    volumes:
      - ./app:/app/app:ro
      - ./scripts:/app/scripts:ro
      - ./docker/local-mail.ini:/usr/local/etc/php/conf.d/zz-local-mail.ini:ro
    depends_on:
      mailcatcher:
        condition: service_healthy
  mailcatcher:
    image: dockage/mailcatcher:0.9.0
    ports:
      - "127.0.0.1:${MAILCATCHER_PORT:-1081}:1080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ruby", "-rsocket", "-e", "TCPSocket.new('127.0.0.1', 1025).close; TCPSocket.new('127.0.0.1', 1080).close"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  fakestripe:
    build: ./fakestripe
    image: studiodeck-fakestripe
    environment:
      FAKESTRIPE_PUBLIC_URL: ${FAKESTRIPE_PUBLIC_URL:-http://localhost:8299}
      FAKESTRIPE_API_KEY: sk_test_fakestripe
      FAKESTRIPE_WEBHOOK_SECRET: whsec_fakestripe_local
      FAKESTRIPE_WEBHOOK_URL: http://web:8080/stripe-webhook.php
      FAKESTRIPE_APP_URL: ${APP_URL:-http://localhost:8080}
      FAKESTRIPE_STATE_PATH: /data/state.json
    ports:
      - "127.0.0.1:${FAKESTRIPE_PORT:-8299}:8200"
    volumes:
      - fakestripe-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8200/health') === false ? 1 : 0);"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  fakestripe-data:
    # Keep the existing store when renaming the service.
    name: studiodeck_fakestrip-data
